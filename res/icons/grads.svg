<svg id="grads" xmlns="http://www.w3.org/2000/svg">
<defs>
    <linearGradient id="text-grad" x1="37%" y1="2%" x2="63%" y2="98%">
        <stop offset="0%" stop-color="hsl(from var(--cur-color) calc(h - 5) calc(s * 0.8) calc(l * 0.75))" />
        <stop offset="25%" stop-color="hsl(from var(--cur-color) h calc(s * 0.8) calc(l * 0.6))" />
        <stop offset="50%" stop-color="hsl(from var(--cur-color) calc(h + 5) calc(s * 0.8) calc(l * 0.75))" />
        <stop offset="75%" stop-color="hsl(from var(--cur-color) h calc(s * 0.8) calc(l * 0.9))" />
        <stop offset="100%" stop-color="hsl(from var(--cur-color) calc(h - 5) calc(s * 0.8) calc(l * 0.75))" />
    </linearGradient>
    <linearGradient id="dis-grad" x1="37%" y1="2%" x2="63%" y2="98%">
        <stop offset="0%" stop-color="hsl(from var(--cur-color) calc(h - 5) calc(s * 0.1) calc(l * 0.55))" />
        <stop offset="25%" stop-color="hsl(from var(--cur-color) h calc(s * 0.05) calc(l * 0.4))" />
        <stop offset="50%" stop-color="hsl(from var(--cur-color) calc(h + 5) calc(s * 0.1) calc(l * 0.55))" />
        <stop offset="75%" stop-color="hsl(from var(--cur-color) h calc(s * 0.05) calc(l * 0.7))" />
        <stop offset="100%" stop-color="hsl(from var(--cur-color) calc(h - 5) calc(s * 0.1) calc(l * 0.55))" />
    </linearGradient>
    <g id="cho-wheel-grad-colors">
        <stop offset="0%" stop-color="hsl(from var(--cur-color-reversed) h s l / 0)" />
        <stop offset="20%" stop-color="hsl(from var(--cur-color-reversed) h s l / 0.1)" />
        <stop offset="100%" stop-color="hsl(from var(--cur-color-reversed) h s l / 0.25)" />
    </g>
    <g id="cho-wheel-grad-inactive-colors">
        <stop offset="0%" stop-color="hsl(from var(--cur-color-dark) h s l / 0)" />
        <stop offset="20%" stop-color="hsl(from var(--cur-color-dark) h s l / 0.1)" />
        <stop offset="100%" stop-color="hsl(from var(--cur-color-dark) h s l / 0.25)" />
    </g>
</defs>
</svg>