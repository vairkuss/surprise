        <style>
            @keyframes awakening {
                0% {
                    background-color: #000;
                    height: 100%;
                    h1 {
                        scale: 0%;

                        color: hsla(0, 0%, 0%, 0);
                    }
                }
                75% {
                    h1 {
                        margin: 0;
                        scale: 120%;
                    }
                }
                90% {
                    h1 {
                        margin-top: 0.1rem;
                        color: #fff;
                        scale: 100%;
                    };
                }
                100% {
                    background-color: hsla(0, 0%, 0%, 0.3);
                    height: 2rem;
                }
            }

            #header {
                animation: awakening 3.5s cubic-bezier(.6,.25,.08,.95);
            }
        </style>
