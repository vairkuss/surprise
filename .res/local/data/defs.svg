<svg id="grads" width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
<defs>
    <linearGradient id="text-grad" spreadMethod="repeat" x1="0" y1="46.4101615137754587%" x2="100%" y2="73.20508075688772935%">
        <stop offset="0%" stop-color="hsl(from var(--cur-color) calc(h - 5) calc(s * 0.8) calc(l * 0.75))" />
        <stop offset="25%" stop-color="hsl(from var(--cur-color) h calc(s * 0.8) calc(l * 0.6))" />
        <stop offset="50%" stop-color="hsl(from var(--cur-color) calc(h + 5) calc(s * 0.8) calc(l * 0.75))" />
        <stop offset="75%" stop-color="hsl(from var(--cur-color) h calc(s * 0.8) calc(l * 0.9))" />
        <stop offset="100%" stop-color="hsl(from var(--cur-color) calc(h - 5) calc(s * 0.8) calc(l * 0.75))" />
    </linearGradient>
    <linearGradient id="dis-grad" spreadMethod="repeat" x1="0" y1="46.4101615137754587%" x2="100%" y2="73.20508075688772935%">
        <stop offset="0%" stop-color="hsl(from var(--cur-color) calc(h - 5) calc(s * 0.1) calc(l * 0.55))" />
        <stop offset="25%" stop-color="hsl(from var(--cur-color) h calc(s * 0.05) calc(l * 0.4))" />
        <stop offset="50%" stop-color="hsl(from var(--cur-color) calc(h + 5) calc(s * 0.1) calc(l * 0.55))" />
        <stop offset="75%" stop-color="hsl(from var(--cur-color) h calc(s * 0.05) calc(l * 0.7))" />
        <stop offset="100%" stop-color="hsl(from var(--cur-color) calc(h - 5) calc(s * 0.1) calc(l * 0.55))" />
    </linearGradient>
    
    <linearGradient id="cho-wheel-grad-colors">
        <stop offset="0%" stop-color="hsl(from var(--cur-color-reversed) h s l / 0)" />
        <stop offset="20%" stop-color="hsl(from var(--cur-color-reversed) h s l / 0.1)" />
        <stop offset="100%" stop-color="hsl(from var(--cur-color-reversed) h s l / 0.25)" />
    </linearGradient>
    <linearGradient id="cho-wheel-grad-inactive-colors">
        <stop offset="0%" stop-color="hsl(from var(--cur-color-dark) h calc(s * 0.5) l / 0)" />
        <stop offset="20%" stop-color="hsl(from var(--cur-color-dark) h calc(s * 0.5) l / 0.1)" />
        <stop offset="100%" stop-color="hsl(from var(--cur-color-dark) h calc(s * 0.5) l / 0.25)" />
    </linearGradient>
    
    
	<linearGradient id="clip-bord-grad">
		<stop offset="0%" stop-color="white" stop-opacity="0" />
		<stop offset="100%" stop-color="white" stop-opacity="1" />
	</linearGradient>
	<radialGradient id="clip-corn-grad" cx="1" cy="1" r="1">
		<stop offset="0%" stop-color="white" stop-opacity="1" />
		<stop offset="100%" stop-color="white" stop-opacity="0" />
	</radialGradient>
	
	<mask id="faded-border-clip">
		<path d="m6 6h6v6h-6" fill="white" />
		<g id="borders" fill="url(#clip-bord-grad)">
			<path d="m0 6h6v6H0" />
			<path d="m0 6h6v6H0" transform="rotate(90 9 9)" />
			<path d="m0 6h6v6H0" transform="rotate(180 9 9)" />
			<path d="m0 6h6v6H0" transform="rotate(270 9 9)" />
		</g>
		<g id="corners" fill="url(#clip-corn-grad)">
			<path d="m0 0h6v6H0" />
			<path d="m0 0h6v6H0" transform="rotate(90 9 9)" />
			<path d="m0 0h6v6H0" transform="rotate(180 9 9)" />
			<path d="m0 0h6v6H0" transform="rotate(270 9 9)" />
		</g>
	</mask>
</defs>
</svg>