<svg id="grads" xmlns="http://www.w3.org/2000/svg">
<defs>
    <!-- MAIN -->
    <linearGradient id="text-grad" gradientUnits="userSpaceOnUse" spreadMethod="mirror" x1="12%" y1="0" x2="0" y2="48%">
        <stop offset="0%" stop-color="hsl(from var(--cur-color) calc(h - 5) calc(s * 0.8) calc(l * 0.75))" />
        <stop offset="50%" stop-color="hsl(from var(--cur-color) h calc(s * 0.8) calc(l * 0.6))" />
        <stop offset="100%" stop-color="hsl(from var(--cur-color) calc(h + 5) calc(s * 0.8) calc(l * 0.75))" />
    </linearGradient>
    <linearGradient id="dis-grad" gradientUnits="userSpaceOnUse" spreadMethod="mirror" x1="12%" y1="0" x2="0" y2="48%">
        <stop offset="0%" stop-color="hsl(from var(--cur-color) calc(h - 5) calc(s * 0.1) calc(l * 0.55))" />
        <stop offset="50%" stop-color="hsl(from var(--cur-color) h calc(s * 0.05) calc(l * 0.4))" />
        <stop offset="100%" stop-color="hsl(from var(--cur-color) calc(h + 5) calc(s * 0.1) calc(l * 0.55))" />
    </linearGradient>

    <!-- CHO-WHEEL -->
    <linearGradient id="cho-wheel-grad-colors">
        <stop offset="0%" stop-color="hsl(from var(--cur-color-reversed) h s l / 0)" />
        <stop offset="20%" stop-color="hsl(from var(--cur-color-reversed) h s l / 0.1)" />
        <stop offset="100%" stop-color="hsl(from var(--cur-color-reversed) h s l / 0.25)" />
    </linearGradient>
    <linearGradient id="cho-wheel-grad-inactive-colors">
        <stop offset="0%" stop-color="hsl(from var(--cur-color-dark) h calc(s * 0.5) l / 0)" />
        <stop offset="20%" stop-color="hsl(from var(--cur-color-dark) h calc(s * 0.5) l / 0.1)" />
        <stop offset="100%" stop-color="hsl(from var(--cur-color-dark) h calc(s * 0.5) l / 0.25)" />
    </linearGradient>
</defs>
</svg>