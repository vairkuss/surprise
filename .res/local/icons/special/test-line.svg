<svg xmlns="http://www.w3.org/2000/svg"
     width="48"
     height="16"
     viewBox="0 0 48 16">

    <defs>
        <filter id="fog-displacement"
                x="0%"
                y="-50%"
                width="200%"
                height="200%"
                filterUnits="userSpaceOnUse">
            <feTurbulence numOctaves="100"
                          seed="714825285"
                          baseFrequency="0.05 0.0714825285"
                          stitchTiles="stitch"
                          width="100%"
                          height="100%"/>
            <feTile width="200%" height="200%"/>
            <feOffset dx="0" result="offsettedTurbulenceTile">
                <animate attributeName="dx"
                         values="0;-16"
                         dur="5s"
                         repeatCount="indefinite"/>
            </feOffset>
            <feDisplacementMap in2="offsettedTurbulenceTile"
                               in="SourceGraphic"
                               result="displacement"
                               scale="15"
                               xChannelSelector="R"
                               yChannelSelector="R"/>
            <feGaussianBlur in="displacement" stdDeviation="0.5"/>
        </filter>
        
        <radialGradient id="fog-grad-r">
            <stop offset="0"/>
            <stop stop-color="#fff" offset=".6">
                <animate attributeName="offset"
                         values=".9;.5;.9"
                         dur="8s"
                         repeatCount="indefinite"/>
            </stop>
        </radialGradient>
        
        <linearGradient id="fog-grad-l" x1="1" x2="0">
            <stop stop-color="#fff" offset="0"/>
            <stop offset=".9"/>
        </linearGradient>
        
        <mask id="fog-mask">
            <rect width="16"
                  height="16"
                  fill="url(#fog-grad-l)"
                  filter="url(#fog-displacement)"/>
        </mask>
        
        <pattern id="fog-pattern"
                 viewBox="0,0,16,16"
                 width="16"
                 height="16">
            <rect width="16"
                  height="16"
                  mask="url(#fog-mask)"
                  fill="#fff"
                  transform="rotate(270 8 8)"/>
        </pattern>
    </defs>


    <rect width="100%" height="100%" fill="url(#fog-pattern)"/>
</svg>