<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker
            id="wave-cap"
            markerWidth="1"
            viewBox="0 0 3 4"
            refX="1.5"
            orient="auto">
            <path d="M0 0C0 1 .5 1.5 1.5 1.5S3 1 3 0"/>
        </marker>
    </defs>

    <g
        id="waves-left"
        stroke="#fff"
        stroke-width="1.5"
        marker-mid="url(#wave-cap)">
        <use href="#wave" transform="translate(0 -3)"/>
        <path id="wave" d="M8 8C5.5 6 4 7 3 8 4 7 5.5 6 8 8"/>
        <use href="#wave" transform="translate(0 3)"/>
    </g>

    <use href="#waves-left" transform="scale(-1)" x="-16" y="-16"/>
</svg>