<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../styles/unique/snake.css">
    <link rel="stylesheet" href="../styles/common/colorctl.css">
    <link rel="stylesheet" href="../styles/common/bgctl.css">
    <link rel="stylesheet" href="../styles/common/blockctl.css">
    <link rel="stylesheet" href="../styles/common/btnctl.css">
    <title>BEASTAXY</title>
</head>

<body>

    <div id="stats">
        <div id="score"></div>
        <div id="action-panel">
            <img alt="stamina" src="/res/images/gui/stamina/0.png" id="stamina" onclick="Board.DASH()">
        </div>
    </div>

    <div class="block">
        <canvas id="board" width=200 height=200></canvas>
    </div>
    
    <div class="block">
        <div id="bar">
            <div class="btn block" onclick="Board.pause()">
                <div class="icon">p</div>
            </div>
            <div class="btn block" onclick="Board.gameStart()">
                <div class="icon">r</div>
            </div>
            <div class="btn block" onclick="Board.gameOver()">
                <div class="icon">k</div>
            </div>
        </div>
    </div>
    <script src="scripts/init.js" id="init"></script>
    <script src="../scripts/BEAST/0T.js"></script>
    <script src="../scripts/BEAST/1A.js"></script>
    <script src="../scripts/BEAST/2S.js"></script>
    <script src="../scripts/BEAST/3E.js"></script>
    <script src="../scripts/BEAST/4B.js"></script>
</body>
</html>
