<!DOCTYPE html>
<html>
<head>
      <meta charset="UTF-8">
    <link rel="stylesheet" href="snake.css">
    <title>HEROSNAKE</title>
</head>

<body>
    <canvas id="board" width=200 height=200></canvas>
    <div id="stats">
        <div id="score"></div>
        <div><img src="imgs/stamina-0.png" id="stamina" onclick="Board.addInput(Board.snake.direction)"></div>
    </div>
    <div id="bar">
        <div class="btn" onclick="Board.pause()">p</div>
        <div class="btn" onclick="Board.gameStart()">r</div>
        <div class="btn" onclick="Board.gameOver()">k</div>
    </div>
    <script src="snake.js"></script>
</body>
</html>
