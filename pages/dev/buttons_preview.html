<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="styles/common.css" />
    <link rel="stylesheet" href="styles/buttons_preview.css" />
    <title>Buttons preview</title>
</head>

<body>
    <div id="cover"></div>

    <div class="block">
        <div class="lable icon">INFILAXY</div>
        <div class="icon">Lorem bibsum bla bla bla choto tam eto razumnij tekst ya ochen umnij pupupupu</div>
        <div id="buttons">

            <div class="btn block">
                <div class="icon" id="arrow" onclick='moveTo("/25285")'></div>
            </div>
            <div class="btn block">
                <div class="icon" id="rune" onclick='moveTo("/404")'></div>
            </div>
            <div class="btn block">
                <div class="icon" id="filter"></div>
            </div>
            <div class="btn block">
                <div class="icon" id="play" onclick='moveTo("/snake")'></div>
            </div>
            <div class="btn block"> 
                <div class="icon" id="pause"></div>
            </div>
            <div class="btn block">
                <div class="icon" id="plus"></div>
            </div>
            <div class="btn block">
                <div class="icon" id="loop"></div>
            </div>
            <div class="btn block">
                <div class="icon" id="random"></div>
            </div>
            <div class="btn block" onclick="debug()">
                <div class="icon">testing</div>
            </div>

        </div>
    </div>

    <div class="block" id="input" style="opacity:0">

        <label for="values"></label>
        <input type="text" id="values" placeholder="h, s, l" value="714, 825, 285" />
                <pre id="message"></pre>
                
                <div class="btn block" id="execute" onclick="newColor()">
                    <div class="icon">submit</div>
                </div>
                
            </div>
    
    <script src="scripts/preview.js"></script>
    <script src="scripts/init.js" id="init"></script>
    
</body>

</html>
