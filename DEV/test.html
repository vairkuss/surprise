<svg style="display:none" id="grads" xmlns="http://www.w3.org/2000/svg">
<defs>
    <g id="cho-wheel-grad-colors">
        <stop offset="0%" stop-color="hsl(from var(--cur-color-reversed) h s l / 0)" />
        <stop offset="20%" stop-color="hsl(from var(--cur-color-reversed) h s l / 0.1)" />
        <stop offset="100%" stop-color="hsl(from var(--cur-color-reversed) h s l / 0.25)" />
    </g>
    <g id="cho-wheel-grad-inactive-colors">
        <stop offset="0%" stop-color="hsl(from var(--cur-color-dark) h calc(s * 0.5) l / 0)" />
        <stop offset="20%" stop-color="hsl(from var(--cur-color-dark) h calc(s * 0.5) l / 0.1)" />
        <stop offset="100%" stop-color="hsl(from var(--cur-color-dark) h calc(s * 0.5) l / 0.25)" />
    </g>
</defs>
</svg>
